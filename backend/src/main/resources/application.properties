spring.application.name=Login



spring.datasource.url=jdbc:mysql://localhost:3306/db_login_grupocre?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin


# Controlador JDBC de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================================
# Dialecto de SQL para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ddl-auto:
# 'update': crea o actualiza automáticamente las tablas según tus clases @Entity (como User.java)
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL ejecutadas por Spring Data JPA (útil para pruebas)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
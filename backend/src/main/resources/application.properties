spring.application.name=Login


# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/login_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=unaClaveSecretaMuyLargaParaJWT2024
app.jwt.expiration-minutes=60

# Seguridad
app.security.max-login-attempts=5
app.security.lock-duration-minutes=15